# ---------------------------------------------------------------------------
# The Movbox web app + Caddy, for Oracle Cloud Always Free.
#
#   web    — the Next.js server (built from deploy/Dockerfile)
#   caddy  — TLS termination + reverse proxy, automatic certificates
#
# Only Caddy publishes ports. The app is reachable from the compose network
# only, so nothing but the proxy is exposed.
#
# Start:   docker compose -f deploy/docker-compose.yml up -d --build
# Logs:    docker compose -f deploy/docker-compose.yml logs -f web
# ---------------------------------------------------------------------------

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        # Baked into the client bundle at build time.
        NEXT_PUBLIC_ADS_ENABLED: "true"
        NEXT_PUBLIC_SITE_URL: "https://movbox.xyz"
    image: movbox-web:latest
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    expose:
      - "3000"
    volumes:
      # The ISR cache. Without this volume every container restart re-renders
      # the whole site, which is a CPU spike on a 2-core box.
      - movbox-cache:/app/.next/cache
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

volumes:
  movbox-cache:
  caddy-data:
  caddy-config:
